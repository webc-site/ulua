[package]
name = "ulua-compile-cli"
description = "Command-line Luau source-to-bytecode compiler (Rust)."
keywords = ["luau", "lua", "compiler", "bytecode", "cli"]
categories = ["command-line-utilities", "compilers"]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "ulua-compile"
path = "src/main.rs"

[dependencies.ulua-ast]
path = "../ulua-ast"
version = "0.1.2"

[dependencies.ulua-bytecode]
path = "../ulua-bytecode"
version = "0.1.2"

[dependencies.ulua-cli-lib]
path = "../ulua-cli-lib"
version = "0.1.2"

[dependencies.ulua-code-gen]
path = "../ulua-code-gen"
version = "0.1.2"

[dependencies.ulua-common]
path = "../ulua-common"
version = "0.1.2"

[dependencies.ulua-compiler]
path = "../ulua-compiler"
version = "0.1.2"

[dependencies.ulua-vm]
path = "../ulua-vm"
version = "0.1.2"

# 多文件并行编译（files.par_iter）；线程数默认取硬件并发
[dependencies.rayon]
version = "1.12"

# 旧 [features] 段的 default/std/wasm 为零消费点空特性（无 cfg 门控、无
# 下游转发），删除虚假 no_std 特性面（对齐 ulua-bytecode 先例）。

[dev-dependencies.ulua-cli-lib]
path = "../ulua-cli-lib"
features = ["test-utils"]
version = "0.1.2"
