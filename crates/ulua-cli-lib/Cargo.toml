[package]
name = "ulua-cli-lib"
version = "0.1.5"
description = "Shared command-line helpers used by the ulua tool crates."
keywords = [ "luau", "lua", "cli" ]
categories = [ "command-line-utilities", "development-tools" ]

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = [ "rlib" ]

[dependencies.memchr]
workspace = true
default-features = false

[dependencies.ulua-ast]
path = "../ulua-ast"
version = "0.1.5"

[dependencies.ulua-common]
path = "../ulua-common"
version = "0.1.5"

[dependencies.ulua-compiler]
path = "../ulua-compiler"
version = "0.1.5"

[dependencies.ulua-require]
version = "0.1.5"
path = "../ulua-require"

[dependencies.ulua-vm]
path = "../ulua-vm"
version = "0.1.5"

[features]
test-utils = [ ]
