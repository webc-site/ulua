[package]
name = "ulua-bytecode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line Luau bytecode disassembler and inspector (Rust)."
keywords = ["luau", "lua", "bytecode", "disassembler", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "ulua-bytecode"
path = "src/main.rs"

[dependencies]
ulua-ast = { path = "../ulua-ast", version = "0.1.2" }
ulua-bytecode = { path = "../ulua-bytecode", version = "0.1.2" }
ulua-cli-lib = { path = "../ulua-cli-lib", version = "0.1.2" }
ulua-code-gen = { path = "../ulua-code-gen", version = "0.1.2" }
ulua-compiler = { path = "../ulua-compiler", version = "0.1.2" }
ulua-vm = { path = "../ulua-vm", version = "0.1.2" }

[features]
default = ["std"]
std = []
wasm = []

