[package]
name = "ulua-vm"
version = "0.1.5"
description = "The Luau register virtual machine and standard library (Rust)."
keywords = [ "luau", "lua", "vm", "interpreter", "bytecode" ]
categories = [ "compilers", "emulators" ]

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = [ "rlib" ]

[dependencies.coarsetime]
workspace = true

[dependencies.itoa]
workspace = true
default-features = false

[dependencies.jiff]
workspace = true

[dependencies.memchr]
workspace = true
default-features = false
features = [ "alloc" ]

[dependencies.strum]
workspace = true

[dependencies.ulua-common]
path = "../ulua-common"
version = "0.1.5"

[features]
luai_gcmetrics = [ ]
hard_mem_tests = [ ]
