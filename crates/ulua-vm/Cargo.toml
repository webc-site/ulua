[package]
name = "ulua-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Luau register virtual machine and standard library (Rust)."
keywords = ["luau", "lua", "vm", "interpreter", "bytecode"]
categories = ["compilers", "emulators"]

[lib]
crate-type = ["rlib"]

[dependencies]
coarsetime = "0.1.37"
itoa = { version = "1.0.18", default-features = false }
# 时间分解/时区纯 Rust 实现（os.date 的 gmtime/localtime 层，替代 libc FFI）。
# 默认特性（std + tz-system + tzdb-*）：native 读系统时区库；
# wasm32-unknown-unknown 无 tz 面时 system() 回退 UTC，与本仓旧 wasm shim 同语义。
jiff = "0.2.37"
memchr = { version = "2.8.3", default-features = false, features = ["alloc"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
ulua-common = { path = "../ulua-common", version = "0.1.2" }

[features]
luai_gcmetrics = []
hard_mem_tests = []

