[package]
name = "ulua-analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Luau type checker and type inference (Rust)."
keywords = ["luau", "lua", "typechecker", "inference", "types"]
categories = ["compilers", "development-tools"]

[lib]
crate-type = ["rlib"]

[dependencies]
ulua-ast = { path = "../ulua-ast", version = "0.1.1" }
ulua-bytecode = { path = "../ulua-bytecode", version = "0.1.1" }
ulua-common = { path = "../ulua-common", version = "0.1.1" }
ulua-compiler = { path = "../ulua-compiler", version = "0.1.1" }
ulua-config = { path = "../ulua-config", version = "0.1.1" }
ulua-vm = { path = "../ulua-vm", version = "0.1.1" }

[features]
default = ["std"]
std = []
native = ["std"]
cli = ["native"]
native-codegen = ["native"]
wasm = []
luau_assert = ["ulua-common/luau_assert"]

# The page allocator's DebugLuauFreezeArena path uses VirtualAlloc/VirtualProtect
# on Windows (paged_allocate/freeze/unfreeze). Use windows-sys (raw Win32), as
# ulua-common does — the high-level `windows` crate was referenced but never
# declared, so Windows failed to build (E0433: cannot find crate `windows`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

