[package]
name = "ulua-config"
version = "0.1.7"
description = "`.uluac` configuration handling for Luau (Rust)."
keywords = [ "luau", "lua", "config", "configuration" ]
categories = [ "config", "parsing" ]

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
