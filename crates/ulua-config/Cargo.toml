[dependencies.ulua-bytecode]
path = "../ulua-bytecode"
version = "0.1.7"

[dependencies.ulua-common]
path = "../ulua-common"
version = "0.1.7"

[dependencies.ulua-compiler]
path = "../ulua-compiler"
version = "0.1.7"

[dependencies.ulua-vm]
path = "../ulua-vm"
version = "0.1.7"
