[package]
name = "ulua-code-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native A64/X64 JIT code generation for compiled Luau bytecode."
keywords = ["luau", "lua", "codegen", "jit", "assembler"]
categories = ["compilers"]

[lib]
crate-type = ["rlib"]

[dependencies]
ulua-common = { path = "../ulua-common", version = "0.1.1" }
ulua-vm = { path = "../ulua-vm", version = "0.1.1" }

[features]
default = ["std"]
std = []
native = ["std"]
cli = ["native"]
native-codegen = ["native"]
wasm = []

# The JIT code-allocator's Windows path uses VirtualAlloc/VirtualFree/
# VirtualProtect and FlushInstructionCache/GetCurrentProcess. Use windows-sys
# (raw Win32), matching the rest of the workspace — the high-level `windows`
# crate was referenced but never declared (E0433: cannot find crate `windows`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(CODEGEN_TARGET_X64)', 'cfg(CODEGEN_TARGET_A64)'] }
