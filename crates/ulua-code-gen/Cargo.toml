[package]
name = "ulua-code-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native A64/X64 JIT code generation for compiled Luau bytecode."
keywords = ["luau", "lua", "codegen", "jit", "assembler"]
categories = ["compilers"]

[lib]
crate-type = ["rlib"]

[dependencies]
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
ulua-common = { path = "../ulua-common", version = "0.1.2" }
ulua-vm = { path = "../ulua-vm", version = "0.1.2" }

# 集成测试需要真实源码→字节码管线（a64_frame_spill_layout 的端到端 JIT 用例）
[dev-dependencies]
ulua-compiler = { path = "../ulua-compiler", version = "0.1.2" }


# The JIT code-allocator's Windows path uses VirtualAlloc/VirtualFree/
# VirtualProtect and FlushInstructionCache/GetCurrentProcess. Use windows-sys
# (raw Win32), matching the rest of the workspace — the high-level `windows`
# crate was referenced but never declared (E0433: cannot find crate `windows`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
] }


[lints.rust]
# is_supported 已改用真实 target_arch/target_os 谓词，无需注册伪 cfg 名
unexpected_cfgs = { level = "warn" }
