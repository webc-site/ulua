[package]
name = "ulua-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "End-to-end / integration test suite for ulua: exercises the CLI binaries and library API as a shipping product."
publish = false

# No library or binaries — this crate exists purely for its `tests/` integration suite.
[lib]
path = "src/lib.rs"

[dev-dependencies]
ulua = { path = "../ulua", version = "0.1.2" }
ulua-common = { path = "../ulua-common", version = "0.1.2" }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Pull in the CLI crates so cargo exposes their binaries to assert_cmd's
# `cargo_bin(..)` lookup (CARGO_BIN_EXE_* / target-dir discovery) deterministically.
ulua-repl-cli = { path = "../ulua-repl-cli", version = "0.1.2" }
ulua-analyze-cli = { path = "../ulua-analyze-cli", version = "0.1.2" }
ulua-ast-cli = { path = "../ulua-ast-cli", version = "0.1.2" }
ulua-compile-cli = { path = "../ulua-compile-cli", version = "0.1.2" }
ulua-bytecode-cli = { path = "../ulua-bytecode-cli", version = "0.1.2" }
ulua-reduce-cli = { path = "../ulua-reduce-cli", version = "0.1.2" }
sonic-rs = "0.5.10"
parking_lot = "0.12.5"

