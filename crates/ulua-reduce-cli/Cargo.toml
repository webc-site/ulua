[package]
name = "ulua-reduce-cli"
description = "Command-line Luau test-case reducer (Rust)."
keywords = [ "luau", "lua", "reduce", "minimizer", "cli" ]
categories = [ "command-line-utilities", "development-tools" ]

[package.version]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = [ "rlib" ]

[[bin]]
name = "ulua-reduce"
path = "src/main.rs"

[dependencies.memchr]
workspace = true

[dependencies.ulua-ast]
path = "../ulua-ast"
version = "0.1.4"

[dependencies.ulua-cli-lib]
path = "../ulua-cli-lib"
version = "0.1.4"

[dependencies.ulua-common]
path = "../ulua-common"
version = "0.1.4"

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.ulua-cli-lib]
path = "../ulua-cli-lib"
features = [ "test-utils" ]
