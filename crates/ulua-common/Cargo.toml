[package]
name = "ulua-common"
description = "Core types, flags, and shared utilities for the ulua Luau-in-Rust toolchain."
keywords = ["luau", "lua", "data-structures"]
categories = ["data-structures"]

version = "0.1.7"

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = []
# `std` 有 cfg(feature = "std") 消费点（functions/assert_call_handler.rs），保留；
# 曾有的 native/cli/native-codegen/wasm 空特性零 cfg 门控、零下游转发，删之。
luau_enable_time_trace = []


[dependencies]
fast-float2 = { workspace = true }
foldhash = { workspace = true }
# hashbrown 激活 `default-hasher`（由 foldhash 驱动），提供原生的 `new()` / `with_capacity()`。
hashbrown = { workspace = true }
indexmap = { workspace = true }
memchr = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true }
