[package]
name = "ulua-ast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Luau lexer, parser, and AST (faithful Rust port)."
keywords = ["luau", "lua", "parser", "lexer", "ast"]
categories = ["parser-implementations", "parsing"]

[lib]
crate-type = ["rlib"]

[dependencies]
itoa = { workspace = true, default-features = false }
memchr = { workspace = true, default-features = false }
strum = { workspace = true }
thiserror.workspace = true
ulua-common = { path = "../ulua-common", version = "0.1.4" }


