[package]
name = "ulua-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Luau source-to-bytecode compiler (Rust)."
keywords = ["luau", "lua", "compiler", "bytecode"]
categories = ["compilers"]

[lib]
crate-type = ["rlib"]

[dependencies]
memchr = { workspace = true, default-features = false }
museair = { workspace = true }
thiserror = { workspace = true }
ulua-ast = { path = "../ulua-ast", version = "0.1.4" }
ulua-bytecode = { path = "../ulua-bytecode", version = "0.1.4" }
ulua-common = { path = "../ulua-common", version = "0.1.4" }


