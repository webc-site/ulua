[package]
name = "ulua-ast-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Luau AST dump CLI (Rust)."
keywords = ["luau", "lua", "ast", "parser", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "ulua-ast"
path = "src/main.rs"

[dependencies]
ulua-analysis = { path = "../ulua-analysis", version = "0.1.2" }
ulua-ast = { path = "../ulua-ast", version = "0.1.2" }
ulua-cli-lib = { path = "../ulua-cli-lib", version = "0.1.2" }

[features]
default = ["std"]
std = []
wasm = []

