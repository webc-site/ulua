[package]
name = "ulua-ast-cli"
description = "Luau AST dump CLI (Rust)."
keywords = [ "luau", "lua", "ast", "parser", "cli" ]
categories = [ "command-line-utilities", "development-tools" ]
version = "0.1.6"

[package.edition]
workspace = true

[package.license]
workspace = true

[package.authors]
workspace = true

[package.repository]
workspace = true

[lib]
crate-type = [ "rlib" ]

[[bin]]
name = "ulua-ast"
path = "src/main.rs"

[dependencies.ulua-analysis]
path = "../ulua-analysis"
version = "0.1.6"

[dependencies.ulua-ast]
path = "../ulua-ast"
version = "0.1.6"

[dependencies.ulua-cli-lib]
path = "../ulua-cli-lib"
version = "0.1.6"

[dev-dependencies.ulua-cli-lib]
path = "../ulua-cli-lib"
features = [ "test-utils" ]
version = "0.1.6"
