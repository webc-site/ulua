[workspace]
resolver = "3"
members = [

  "crates/ulua",
  "crates/ulua-analysis",
  "crates/ulua-analyze-cli",
  "crates/ulua-ast",
  "crates/ulua-ast-cli",
  "crates/ulua-bytecode",
  "crates/ulua-bytecode-cli",
  "crates/ulua-capi",
  "crates/ulua-cli-lib",
  "crates/ulua-cli-test",
  "crates/ulua-code-gen",
  "crates/ulua-common",
  "crates/ulua-compile-cli",
  "crates/ulua-compiler",
  "crates/ulua-config",
  "crates/ulua-conformance",
  "crates/ulua-e2e",
  "crates/ulua-reduce-cli",
  "crates/ulua-repl-cli",
  "crates/ulua-require",
  "crates/ulua-rt",
  "crates/ulua-checked-macros",
  "crates/ulua-rt-derive",
  "crates/ulua-unit-test",
  "crates/ulua-vm",
  "crates/ulua-web",
  "examples/*",
]
# The cargo-fuzz crate is its own (nightly/libfuzzer) workspace — keep it out of
# the main one so normal `cargo build`/CI never pulls the fuzz toolchain.
exclude = ["fuzz", "benchmarks/runner"]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["x-at-01 <x-at-01@googlegroups.com>"]
repository = "https://github.com/webc-site/ulua"
description = "Pure Rust Luau compiler, register VM, and type checker"
keywords = ["luau", "lua", "compiler", "vm", "typechecker"]
categories = ["compilers", "emulators", "parser-implementations", "development-tools", "wasm"]

# 外部依赖统一口径（评审 major 修复）：版本取各 crate 现有出现的最高 semver
# 下限（只升不降）。features/default-features/optional 的并集有陷阱（如 memchr、
# itoa 存在 default-features 分歧），故根表只承载"各消费 crate 完全一致"的
# 特性口径；有分歧的条目根表保持干净，由消费 crate 在声明处追加
# features / default-features / optional，target 门控一律留在消费处。
[workspace.dependencies]
assert_cmd = "2"
bitflags = { version = "2.13.2", default-features = false }
bstr = { version = "1", features = ["serde"] }
coarsetime = "0.1.38"
console_error_panic_hook = "0.1"
divan = "0.1"
fast-float2 = { version = "0.2.4", default-features = false }
foldhash = "0.2.0"
futures-util = "0.3"
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc", "default-hasher"] }
hipstr = "0.8.0"
indexmap = "2.14.2"
itoa = { version = "1.0.18", default-features = false }
jiff = "0.2.37"
memchr = { version = "2.8.3", default-features = false }
mimalloc = "0.1.52"
museair = "0.6.0"
parking_lot = "0.12.5"
predicates = "3"
proc-macro2 = "1.0"
quote = "1.0"
rayon = "1.12"
rustyline = "18"
serde = { version = "1.0", default-features = false }
signal-hook-registry = "1.4"
smallvec = { version = "1.16.2", default-features = false, features = ["const_generics"] }
sonic-rs = "0.5.10"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
syn = { version = "3.0", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
wasm-bindgen = "0.2"
windows-sys = "0.61"

[workspace.metadata.cargo-machete]
ignored = [
  "wasm-bindgen",
  "ulua-analysis",
  "ulua-ast",
  "ulua-bytecode",
  "ulua-compiler",
  "ulua-config",
  "ulua-vm",
]


[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
lto = "fat"
codegen-units = 1
